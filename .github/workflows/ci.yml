name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
  magpie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: npm ci --ignore-scripts
      - name: Download the pinned Magpie host
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/yetone/magpie/8ef9fc578ced531b7ca835a3133c37f608a70e6a/internal/plugin/host.js -o "$RUNNER_TEMP/magpie-host.js"
      - run: npm run test:magpie
        env:
          MAGPIE_HOST_PATH: ${{ runner.temp }}/magpie-host.js
